    input,select{width:100%;border:2px solid #f3caa5;border-radius:14px;padding:12px;background:#fffaf4}

socket.on("joined",d=>{myPlayerId=d.playerId;roomCode=d.code;});socket.on("errorMessage",m=>alert(messageText(m)));socket.on("state",s=>{const oldPhase=state?.phase,oldLast=state?.lastPlayed?.card?.id;state=s;if(s.message)addLog(messageText(s.message));if(s.lastPlayed&&s.lastPlayed.card&&s.lastPlayed.card.id!==oldLast)playCardSound(s.lastPlayed.card);if(s.phase==="slap"&&oldPhase!=="slap")playSlapSound();render();});
function safeTap(key,event,fn){event&&event.preventDefault();event&&event.stopPropagation();initAudio();const now=performance.now();if(lastTap.key===key&&now-lastTap.time<350)return;lastTap={key,time:now};fn();}
function createRoom(){socket.emit("createRoom",{name:$("name").value||"Jugador",maxPlayers:Number($("maxPlayers").value)});}
function joinRoom(){socket.emit("joinRoom",{name:$("name").value||"Jugador",code:$("joinCode").value});}
function render(){applyTranslations();if(!state)return;$("home").classList.add("hidden");$("roomCode").textContent=state.code;if(!state.started){$("lobby").classList.remove("hidden");$("game").classList.add("hidden");$("startBtn").disabled=state.hostId!==myPlayerId||state.players.length!==state.maxPlayers;$("lobbyPlayers").innerHTML=state.players.map(p=>`<span class="badge">${p.connected?"🟢":"⚪"} ${esc(p.name)} · ${p.count}</span>`).join("");return;}$("lobby").classList.add("hidden");$("game").classList.remove("hidden");const me=state.players.find(p=>p.id===myPlayerId),turnName=state.players.find(p=>p.id===state.currentPlayerId)?.name||"";$("status").textContent=state.phase==="finished"?t("winner_status",{player:state.players.find(p=>p.id===state.winnerId)?.name||""}):state.phase==="normal"?t("turn_of",{player:turnName}):state.phase==="slap"?t("slap_status"):t("special_status");$("players").innerHTML=state.players.map(p=>`<div class="player ${p.id===myPlayerId?"me":""} ${p.id===state.currentPlayerId?"turn":""} ${!p.connected?"off":""}"><h3><span>${esc(p.name)} ${p.id===myPlayerId?"("+t("you")+")":""}</span><span>${p.count}</span></h3><div class="small">${p.connected?t("connected"):t("disconnected")}</div></div>`).join("");$("pileCount").textContent=t("center_count",{count:state.centerCount});$("boxInfo").textContent=t("box_count",{count:state.boxCount});$("lastCard").innerHTML=state.lastPlayed?cardHTML(state.lastPlayed.card,state.lastPlayed.playerName):`<span class="small">${t("empty_center")}</span>`;$("playBtn").disabled=!(state.phase==="normal"&&state.currentPlayerId===myPlayerId&&me&&me.count>0);const slapEntry=state.slap?.entries?.find(e=>e.playerId===myPlayerId),handDone=Boolean(slapEntry?.pressedAt);$("handBtn").disabled=handDone||state.phase==="finished";$("handBtn").textContent=state.phase==="slap"?(handDone?t("hand_done"):t("put_hand")):t("hand");$("handBtn").className="hand big"+(state.phase==="slap"&&!handDone?" ready":"")+(handDone?" done":"");renderSpecial();$("log").innerHTML=logLines.slice(-12).map(x=>`<div>${esc(x)}</div>`).join("");}
function renderSpecial(){if(state.phase!=="reaction"||!state.reaction){$("special").classList.remove("show");stopAnimalSound();return;}const entry=state.reaction.entries.find(e=>e.playerId===myPlayerId),card=state.reaction.card;$("special").classList.add("show");$("specialIcon").textContent=card.emoji;$("specialTitle").textContent=t("special_card",{card:cardName(card)});if(entry.stage===0){$("specialBtn").disabled=false;$("specialBtn").textContent=`${card.emoji} ${t("first_click")}`;$("specialTimer").textContent=t("first_click");}else if(entry.stage===1){const left=Math.max(0,entry.readyAt-Date.now());if(left>0){$("specialBtn").disabled=true;$("specialTimer").textContent=t("wait",{seconds:(left/1000).toFixed(1)});startAnimalSound(card.name,Math.min(left,2000));setTimeout(renderSpecial,100);}else{$("specialBtn").disabled=false;$("specialBtn").textContent=`${card.emoji} ${t("click_again")}`;$("specialTimer").textContent=t("click_again");}}else{$("specialBtn").disabled=true;$("specialBtn").textContent=t("completed");$("specialTimer").textContent=t("waiting_rest");}}
function cardHTML(card,playerName){return `<div class="card" style="--c:${card.color}"><div class="card-name">${esc(cardName(card))}</div><div class="emoji">${card.emoji}</div><div class="card-type">${card.type==="normal"?t("normal"):t("especial")}</div></div><div class="small">${t("thrown_by",{player:playerName||""})}</div>`;}
function addLog(text){if(!text)return;if(logLines[logLines.length-1]!==text)logLines.push(text);}function esc(str){return String(str).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));}
function toggleSound(){soundEnabled=!soundEnabled;$("soundBtn").textContent=soundEnabled?t("sound_on"):t("sound_off");if(!soundEnabled){stopAnimalSound();speechSynthesis?.cancel?.();}else initAudio();}
function initAudio(){if(!soundEnabled)return;try{const Ctx=window.AudioContext||window.webkitAudioContext;if(Ctx&&!audioCtx)audioCtx=new Ctx();if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume();}catch(e){}}
function playCardSound(card){if(!soundEnabled)return;initAudio();if(card.type==="normal")speakName(cardName(card));else startAnimalSound(card.name,900);}
function speakName(name){if(!("speechSynthesis"in window))return playBeep(500);try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(name);const langMap={es:"es-ES",en:"en-US",fr:"fr-FR",de:"de-DE",ru:"ru-RU",uk:"uk-UA",hi:"hi-IN",zh:"zh-CN"};u.lang=langMap[currentLang]||"es-ES";u.rate=1.02;u.pitch=1.05;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith((langMap[currentLang]||"es").split("-")[0].toLowerCase()));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){playBeep(500);}}
function playBeep(freq){if(!audioCtx)return;const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="triangle";o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.22,now+.02);g.gain.exponentialRampToValueAtTime(.001,now+.18);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.2);}
function playSlapSound(){playBeep(180);}function startAnimalSound(name,durationMs=2000){if(!soundEnabled)return;initAudio();if(!audioCtx)return;stopAnimalSound();const end=audioCtx.currentTime+durationMs/1000,master=audioCtx.createGain();master.gain.setValueAtTime(.001,audioCtx.currentTime);master.gain.exponentialRampToValueAtTime(.28,audioCtx.currentTime+.03);master.gain.exponentialRampToValueAtTime(.001,end);master.connect(audioCtx.destination);const nodes=[master],o=audioCtx.createOscillator();o.type=name==="Gorila"?"sawtooth":name==="Marmota"?"sine":"triangle";o.frequency.setValueAtTime(name==="Gorila"?72:name==="Marmota"?720:390,audioCtx.currentTime);o.frequency.linearRampToValueAtTime(name==="Gorila"?48:name==="Marmota"?980:180,end);o.connect(master);o.start();o.stop(end);nodes.push(o);activeAnimalSound={nodes};setTimeout(stopAnimalSound,durationMs+60);}
function stopAnimalSound(){if(!activeAnimalSound)return;activeAnimalSound.nodes.forEach(n=>{try{n.stop?.()}catch(e){}try{n.disconnect?.()}catch(e){}});activeAnimalSound=null;}
if("speechSynthesis"in window&&speechSynthesis.onvoiceschanged!==undefined){speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}
applyTranslations();
</script>

# Taco Gato Cabra Queso Pizza — Online multijugador

Versión programada para que cada jugador use su propio móvil, iPhone, iPad u ordenador en ubicaciones distintas.

## Qué incluye

- Sala con código de 5 caracteres.
- De 2 a 8 jugadores.
- Baraja de 64 cartas:
  - Taco x11
  - Gato x11
  - Cabra x11
  - Queso x11
  - Pizza x11
  - Gorila x3
  - Marmota x3
  - Narval x3
- Reparto:
  - 2 a 5 jugadores: 12 cartas por jugador.
  - 6 jugadores: 10 cartas por jugador.
  - 7 u 8 jugadores: 8 cartas por jugador.
- Cartas al centro sincronizadas.
- Coincidencia carta-carta:
  - Cada jugador pulsa su propia mano.
  - El último se lleva el centro.
- Penalización:
  - Pulsar mano cuando no hay coincidencia hace que ese jugador se lleve el centro.
- Especiales:
  - Gorila, Marmota, Narval.
  - Pulsar, esperar 2 segundos, volver a pulsar.
  - El último se lleva el centro.

## Operativa de conexión

1. Un jugador abre la web y pulsa **Crear sala**.
2. El juego muestra un código, por ejemplo `A7KQ2`.
3. Ese jugador comparte el código por WhatsApp.
4. Los demás abren la misma URL, escriben su nombre y el código.
5. Cuando todos han entrado, el anfitrión pulsa **Empezar partida**.
6. Cada jugador usa solo su móvil:
   - **Tirar carta** cuando sea su turno.
   - **MANO** cuando haya coincidencia.
   - Botón especial cuando salga Gorila, Marmota o Narval.

## Instalación local para pruebas en ordenador

```bash
npm install
npm start
```

Abrir:

```text
http://localhost:3000
```

## Para jugar desde ubicaciones distintas

Hay que subir esta carpeta a un hosting Node.js, por ejemplo:

- Render
- Railway
- Fly.io
- VPS propio
- servidor Node.js de cualquier proveedor

Cuando esté desplegado, todos entran con la misma URL pública.

## Despliegue rápido en Render

1. Crear cuenta en Render.
2. New → Web Service.
3. Subir este proyecto a GitHub o conectar repositorio.
4. Build command:

```bash
npm install
```

5. Start command:

```bash
npm start
```

6. Render dará una URL tipo:

```text
https://taco-gato-online.onrender.com
```

7. Compartir esa URL con los jugadores.

## Nota técnica

La reacción de "mano" se mide en el servidor por orden de llegada. En internet siempre puede existir algo de latencia entre móviles, pero para juego familiar funciona correctamente. Para competición estricta habría que añadir calibración de ping/latencia por jugador.
